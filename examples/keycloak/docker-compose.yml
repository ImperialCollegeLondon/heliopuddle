# Example Keycloak for heliopuddle's `oidc` auth mode (AUTH-17). DEMO ONLY:
# dev mode, plain http, fixed passwords. See README.md.
#
#   docker compose up -d                 # Keycloak only (run hp on the host)
#   docker compose --profile hp up -d    # Keycloak plus hp in a container (Linux)

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command: ["start-dev", "--import-realm"]
    environment:
      # Admin console login (master realm): admin / admin.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pin the public URL, so the token `iss` is http://localhost:8180/realms/heliopuddle
      # however Keycloak is reached. This must equal HELIOPUDDLE_OIDC_ISSUER's host part.
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8080"
    volumes:
      - ./realm-heliopuddle.json:/opt/keycloak/data/import/realm-heliopuddle.json:ro
    healthcheck:
      # Healthy once the realm's discovery document is served, which is what hp reads at
      # startup (and fails fast without). The image has no curl, so use bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /realms/heliopuddle/.well-known/openid-configuration HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Optional: hp in a container, started only with `--profile hp`. It uses the
  # host network so that http://localhost:8180 (the issuer) is the same address
  # from inside the container as from your browser. Linux only; on Docker
  # Desktop run hp on the host instead (see README.md). The data directory is
  # mounted at the same absolute path as on the host, so a client on the host
  # can write to the store at the URL the API returns.
  hp:
    profiles: ["hp"]
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    image: heliopuddle:keycloak-example
    network_mode: host
    # Wait until Keycloak serves the discovery document: hp's OIDC startup is fail-fast, so
    # starting it earlier (for example both services from stopped containers) would make it
    # exit. `restart` covers a Keycloak that restarts later.
    depends_on:
      keycloak:
        condition: service_healthy
    restart: on-failure
    environment:
      HELIOPUDDLE_AUTH_MODE: oidc
      HELIOPUDDLE_OIDC_ISSUER: http://localhost:8180/realms/heliopuddle
      HELIOPUDDLE_OIDC_CLIENT_ID: heliopuddle
      HELIOPUDDLE_OIDC_CLIENT_SECRET: ${HP_OIDC_SECRET:-demo-only-client-secret-change-me}
      HELIOPUDDLE_DEMO_DATA: ${HP_DEMO_DATA:-/tmp/hp-keycloak-demo}
    volumes:
      - ./projects:/config:ro
      - ${HP_DEMO_DATA:-/tmp/hp-keycloak-demo}:${HP_DEMO_DATA:-/tmp/hp-keycloak-demo}
      - hp-state:/var/lib/heliopuddle

volumes:
  hp-state:
